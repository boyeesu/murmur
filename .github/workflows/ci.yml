name: Runtime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --offline
      - run: npm test
      # Static checking is not part of this bootstrap job. Add a separate
      # required typecheck job once compiler/declaration dependencies are pinned.
